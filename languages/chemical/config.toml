name = "Chemical"
grammar = "chemical"
path_suffixes = ["ch", "mod"]
line_comments = ["// "]
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string"] },
]
tab_size = 4

[file_icons]
ch = "chemical"
mod = "chemical-mod"
